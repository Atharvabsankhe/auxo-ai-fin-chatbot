services:
  - type: web
    name: auxo-ai-analyst
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 api:app
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: 8000
