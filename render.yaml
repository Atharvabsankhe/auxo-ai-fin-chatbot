services:
  - type: web
    name: auxo-ai-analyst
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker api:app
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: 8000
    disk:
      name: data-storage
      mountPath: /opt/render/project/src/data_storage
      sizeGB: 1

# Note: We need to update src/config.py to use the mountPath if it exists.
